[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "multimodal-rag"
version = "1.0.0"
description = "Multimodal Retrieval-Augmented Generation system for PDF documents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["rag", "pdf", "multimodal", "fastapi", "chromadb", "claude"]

[project.scripts]
rag-ingest = "scripts.ingest_pdf:main"
rag-query  = "scripts.query_cli:main"

# ── pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--tb=short",
    "--strict-markers",
    "-q",
]
markers = [
    "integration: requires real Anthropic API key and full setup",
    "slow: long-running tests (full ingestion pipeline)",
]

# ── ruff (linter) ─────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".git", "__pycache__", "venv", ".venv", "data/"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in default args (FastAPI pattern)
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

# ── black (formatter) ─────────────────────────────────────────────────────────
[tool.black]
line-length = 100
target-version = ["py310", "py311"]
